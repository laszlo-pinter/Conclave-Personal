name: CI

on:
  push:
    branches:
      - main
      - personal-multiplatform
  pull_request:
  workflow_dispatch:
  # Voraussetzung fuer das Release (publish.yml, R14)
  workflow_call:
    inputs:
      release:
        description: "Aufruf aus dem Release: ohne pip-Cache"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
    env:
      CONCLAVE_MODE: development
      CONCLAVE_API_KEY: test-ci-local-key
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ${{ !inputs.release && 'pip' || '' }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev-all]"

      - name: Run tests
        env:
          CONCLAVE_SECRET_KEY_FILE: ${{ runner.temp }}/conclave-secret.key
        run: python -m pytest

  ui-browser:
    name: UI-Browser-Tests (Chromium)
    runs-on: ubuntu-latest
    env:
      CONCLAVE_MODE: development
      CONCLAVE_REQUIRE_BROWSER: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ${{ !inputs.release && 'pip' || '' }}

      - name: Install package and UI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev-all,dev-ui]"
          python -m playwright install --with-deps chromium

      - name: Run UI tests
        run: python -m pytest tests/ui

  security:
    name: Security checks (pip-audit, bandit)
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ${{ !inputs.release && 'pip' || '' }}

      - name: Install package and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev-all,dev-ui,dev-security]"

      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit --skip-editable --progress-spinner off

      - name: Static analysis (medium severity and above)
        run: python -m bandit -r src/conclave --severity-level medium

      - name: Static analysis of the board package (medium severity and above)
        run: python -m bandit -r packages/board/src/conclave_board --severity-level medium

      - name: Board package does not import Personal or provider SDKs (import-linter)
        run: lint-imports

  postgres:
    name: PostgreSQL tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16, per Digest gepinnt (Lieferkette, wie die Actions)
        image: postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: conclave
          POSTGRES_PASSWORD: conclave-ci
          POSTGRES_DB: conclave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conclave -d conclave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONCLAVE_MODE: development
      CONCLAVE_TEST_POSTGRES_DSN: postgresql://conclave:conclave-ci@localhost:5432/conclave_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ${{ !inputs.release && 'pip' || '' }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev-all]"

      - name: Run PostgreSQL tests
        run: python -m pytest tests/persistence -rs

  vendor:
    name: Vendor files against npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare vendored files with npm tarballs (sha512 integrity)
        run: python scripts/check_vendor.py

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: test
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ${{ !inputs.release && 'pip' || '' }}

      - name: Install pinned build tools
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements/release-tools.txt"

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --no-isolation

      - name: Inspect artifacts
        run: python scripts/release/check_dist.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conclave-dist
          path: dist/*

  board-package:
    name: Board package (${{ matrix.os }}, fresh environment)
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ${{ !inputs.release && 'pip' || '' }}

      - name: Install pinned build tools
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements/release-tools.txt"

      - name: Build the board wheel
        run: python -m build --wheel --no-isolation --outdir dist-board packages/board

      - name: Inspect the board wheel
        run: python scripts/release/check_board_wheel.py dist-board

      - name: Install the wheel into a fresh environment (without Personal and provider SDKs)
        run: |
          python -m venv board-env
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=board-env/Scripts; else BIN=board-env/bin; fi
          echo "BOARD_PYTHON=$BIN/python" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install "$(ls dist-board/conclave_board-*.whl)[postgres]"

      - name: Check dependency licenses (Apache-2.0 compatible, psycopg2 as exception)
        run: '"$BOARD_PYTHON" scripts/release/check_board_licenses.py --extra postgres'

      - name: Start the board server and check it
        run: '"$BOARD_PYTHON" scripts/release/smoke_board.py'

      - name: Upload the board wheel (internal wheelhouse, not for PyPI)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: conclave-board-wheel
          path: dist-board/*

  board-api:
    name: Board API v1 without breaking changes (oasdiff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags and main for the comparison)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch main for the comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true

      - name: Compare board-v1.json with the last release (oasdiff breaking)
        run: bash scripts/release/check_board_api.sh
