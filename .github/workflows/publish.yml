name: Publish

# Veroeffentlicht nur ueber einen Tag v<Version>, der zu pyproject.toml passt,
# und erst nach der vollen CI (Tests Linux/Windows, UI, Security, PostgreSQL)
# und der Paketpruefung (R14).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag and version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check tag against pyproject.toml
        env:
          REF: ${{ github.ref }}
        run: python scripts/release/check_version.py "$REF"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [version, ci]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned build tools
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements/release-tools.txt"

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --no-isolation

      - name: Check distributions
        run: python scripts/release/check_dist.py dist

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [version, ci, build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/conclave-personal/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
