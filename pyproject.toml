[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conclave-personal"
version = "0.7.0"
description = "Local personal multi-agent workspace for Windows and Linux."
readme = "README.md"
# Personal steht unter PolyForm; das mitgebuendelte Board-Paket (conclave_board) unter Apache-2.0 (T1)
license = "LicenseRef-PolyForm-Noncommercial-1.0.0 AND Apache-2.0"
license-files = ["LICENSE", "packages/board/LICENSE", "packages/board/NOTICE"]
authors = [{ name = "Laszlo Pinter" }]
requires-python = ">=3.11"
keywords = ["multi-agent", "llm", "local-first", "workspace", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "cryptography>=42.0",
    "flask>=3.1",
    "flask-limiter>=4.0",
    "httpx>=0.27",
    "waitress>=3.0.2",
]

[project.urls]
Homepage = "https://github.com/laszlo-pinter/Conclave-Personal"
Source = "https://github.com/laszlo-pinter/Conclave-Personal"
Issues = "https://github.com/laszlo-pinter/Conclave-Personal/issues"
Documentation = "https://github.com/laszlo-pinter/Conclave-Personal/blob/main/docs/index.md"
Changelog = "https://github.com/laszlo-pinter/Conclave-Personal/blob/main/docs/release-notes-v0.7.0.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0"]
api = ["flask>=3.1", "flask-limiter>=4.0", "waitress>=3.0.2"]
crypto = ["cryptography>=42.0"]
postgres = ["psycopg2-binary>=2.9"]
mcp = ["mcp>=2,<3", "httpx>=0.27"]
# Automatischer Reviewer (W1): nur Standardbibliothek; braucht claude und conclave-mcp (Extra mcp)
reviewer = ["mcp>=2,<3", "httpx>=0.27"]
dev     = ["pytest>=9.0"]
dev-api = ["pytest>=9.0", "flask>=3.1"]
dev-ui  = ["pytest>=9.0", "playwright==1.64.1"]
dev-security = ["pip-audit==2.10.1", "bandit==1.9.4", "import-linter==2.16"]
dev-all = ["pytest>=9.0", "pytest-asyncio>=1.0", "mcp>=2,<3", "flask>=3.1", "flask-limiter>=4.0", "waitress>=3.0.2", "httpx>=0.27", "anthropic>=0.40.0", "openai>=1.0", "cryptography>=42.0", "psycopg2-binary>=2.9"]

[project.scripts]
conclave = "conclave.cli.main:main"
conclave-api = "conclave.api.server:main"
conclave-mcp = "conclave.mcp_server:main"
conclave-watch = "conclave.cli.watch:main"
conclave-reviewer = "conclave.reviewer.cli:main"

# Grenze des Board-Pakets (T1): lint-imports in der CI (Job "security")
[tool.importlinter]
root_packages = ["conclave_board", "conclave"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "conclave_board importiert conclave nicht"
type = "forbidden"
source_modules = ["conclave_board"]
forbidden_modules = ["conclave"]

[[tool.importlinter.contracts]]
name = "conclave_board braucht keine Provider-SDKs, kein httpx und kein MCP"
type = "forbidden"
source_modules = ["conclave_board"]
forbidden_modules = ["anthropic", "openai", "httpx", "mcp"]

[[tool.importlinter.contracts]]
name = "Der Reviewer nutzt nur runtime und HTTP, nicht die Schichten der App (W1)"
type = "forbidden"
source_modules = ["conclave.reviewer"]
forbidden_modules = ["conclave.application", "conclave.infrastructure", "conclave.api", "conclave.cli",
                     "conclave.domain", "conclave.mcp_server", "conclave_board.application",
                     "conclave_board.infrastructure", "conclave_board.api", "flask", "httpx", "mcp"]

[[tool.importlinter.contracts]]
name = "Kern und Personal importieren das Team-Paket nicht (Plan 2.3)"
type = "forbidden"
source_modules = ["conclave_board", "conclave"]
forbidden_modules = ["conclave_board_team"]
allow_indirect_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "packages/board/src"]
testpaths = ["tests"]

[tool.setuptools]
# Das Board-Paket (packages/board, Apache-2.0) wird mitgebuendelt (T1)
package-dir = {"" = "src", "conclave_board" = "packages/board/src/conclave_board"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "packages/board/src"]

[tool.setuptools.package-data]
"conclave" = [
    "assets/conclave-ui.html",
    "assets/static/openapi.json",
    "assets/static/css/*.css",
    "assets/static/js/*.js",
    "assets/static/js/features/*.js",
    "assets/static/vendor/*.js",
    "assets/static/vendor/fonts/*",
    "assets/static/vendor/highlight/*",
    "assets/static/vendor/licenses/*",
    "assets/static/vendor/swagger-ui/*",
    "assets/scripts/windows/*.ps1",
    "assets/scripts/linux/*",
]
